tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get a list of contacts with filtering, sorting, and pagination options'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    example: 1
    description: Page number for pagination.
  - in: query
    name: perPage
    schema:
      type: integer
    example: 10
    description: Number of contacts per page.
  - in: query
    name: sortBy
    schema:
      type: string
    example: 'name'
    description: Field by which to sort contacts.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
    example: 'asc'
    description: Sort order (ascending or descending).
  - in: query
    name: filter
    schema:
      type: string
    example: 'John'
    description: Filter for searching contacts by specific criteria.
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - items
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                items:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 100
                totalPages:
                  type: number
                  example: 10
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Internal Server Error
