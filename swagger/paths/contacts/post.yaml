tags:
  - Contacts
summary: Add a new contact
operationId: addContact
description: 'Add a new contact for the authenticated user'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: "The name of the contact"
            type: string
            example: "Petro Podolets"
          phoneNumber:
            description: "The contact's phone number"
            type: string
            example: "111-222-3333"
          email:
            description: "The contact's email address"
            type: string
            example: "email.example@gmail.com"
          isFavourite:
            description: "Whether the contact is a favorite"
            type: boolean
            example: false
          contactType:
            description: "The type of the contact"
            type: string
            enum: ["work", "home", "personal"]
            example: "personal"
          photo:
            description: "Photo of the contact (file upload)"
            type: string
            format: binary

responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
